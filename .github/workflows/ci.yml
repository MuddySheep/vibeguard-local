name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.28.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test coverage (Node 20.x only)
        if: matrix.node-version == '20.x'
        run: pnpm test:coverage

  size-limit:
    name: Bundle size budget
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: size-limit
        run: pnpm size

  bench-regression:
    name: Benchmark regression
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    # Hard gate as of 1.0: any fixture mean-latency regressing >20%
    # vs benchmarks/baseline.json fails the build. CI variance on
    # GHA runners is typically <15%; the threshold leaves room for
    # noise without masking real regressions.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench

  examples:
    name: Integration examples build & test
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    # Each example under packages/sdk/examples/<name>/ links to the
    # SDK via `file:../..` (which from inside an example resolves to
    # packages/sdk/). Examples deliberately install with npm to mirror
    # the real-world consumer experience; they are not part of the
    # pnpm workspace.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install + test each example
        working-directory: packages/sdk
        run: |
          set -e
          for dir in examples/*/; do
            if [ -f "$dir/package.json" ]; then
              echo ">>> $dir"
              (cd "$dir" && npm install --no-audit --no-fund && npm run typecheck && npm test)
            fi
          done
