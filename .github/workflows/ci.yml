name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test coverage (Node 20.x only)
        if: matrix.node-version == '20.x'
        run: npm run test:coverage

  size-limit:
    name: Bundle size budget
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: size-limit
        run: npm run size

  bench-regression:
    name: Benchmark regression
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    # Hard gate as of 1.0: any fixture mean-latency regressing >20%
    # vs benchmarks/baseline.json fails the build. CI variance on
    # GHA runners is typically <15%; the threshold leaves room for
    # noise without masking real regressions.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run bench

  examples:
    name: Integration examples build & test
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    # Each example under examples/<name>/ links to the SDK via
    # `file:../..` and consumes dist/, so we build the SDK once
    # before iterating over the examples.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install + test each example
        run: |
          set -e
          for dir in examples/*/; do
            if [ -f "$dir/package.json" ]; then
              echo ">>> $dir"
              (cd "$dir" && npm install --no-audit --no-fund && npm run typecheck && npm test)
            fi
          done
